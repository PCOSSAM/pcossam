<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>페이지를 찾을 수 없습니다 | 피코쌤 PCOSSAM</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700;900&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body {
    font-family:'Noto Sans KR',sans-serif;
    background:#1A3A5C; color:#fff;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    text-align:center; padding:24px;
  }
  .wrap { max-width:480px; }
  .code { font-size:88px; font-weight:900; color:#C8973A; letter-spacing:-2px; line-height:1; }
  h1 { font-size:22px; font-weight:700; margin:20px 0 12px; }
  p { font-size:15px; font-weight:300; line-height:1.7; color:rgba(255,255,255,0.75); margin-bottom:32px; }
  .btn {
    display:inline-block; padding:14px 32px; border-radius:8px;
    background:#C8973A; color:#1A3A5C; font-weight:700; font-size:15px;
    text-decoration:none; transition:opacity .2s;
  }
  .btn:hover { opacity:.88; }
  .sub { margin-top:20px; font-size:13px; }
  .sub a { color:rgba(255,255,255,0.6); text-decoration:underline; }
</style>
</head>
<body>
  <div class="wrap">
    <div class="code">404</div>
    <h1>페이지를 찾을 수 없습니다</h1>
    <p>요청하신 주소가 변경되었거나 존재하지 않습니다.<br>홈에서 원하시는 서비스를 찾아보세요.</p>
    <a class="btn" href="/">홈으로 돌아가기</a>
    <div class="sub"><a href="/#services">서비스 & 비용 보기</a></div>
  </div>
</body>
</html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>서원호 · 하나증권 연금전략실 · 디지털 명함</title>
<meta name="description" content="하나증권 연금전략실 영업이사 서원호 — 디지털 명함">
<meta property="og:title" content="서원호 · 하나증권 연금전략실 영업이사">
<meta property="og:description" content="하나로 연결된 모두의 금융">
<meta name="theme-color" content="#052A22">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --green-0:#052A22; --green-1:#083A2F; --green-2:#0E4A3B;
    --line:#1C5A49;
    --mint:#33C6A4; --mint-soft:#7FE6CE;
    --red:#FF5A3C;
    --ivory:#EAF5F0; --slate:#93B7AC; --slate-dim:#6E9488;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%;-webkit-text-size-adjust:100%}
  body{
    font-family:"Pretendard",system-ui,-apple-system,sans-serif;
    background:
      radial-gradient(120% 80% at 50% -10%, #0d4a3b 0%, var(--green-0) 55%) no-repeat,
      var(--green-0);
    color:var(--ivory);
    display:flex;justify-content:center;
    padding:22px 16px 40px;min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%;max-width:430px;
    background:var(--green-1);
    border:1px solid var(--line);border-radius:22px;overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,.5), 0 2px 0 rgba(127,230,206,.06) inset;
    animation:rise .7s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

  .hero{position:relative;line-height:0}
  .hero img{width:100%;height:auto;display:block}
  .hero::after{content:"";position:absolute;inset:0;
    background:linear-gradient(to bottom, rgba(8,58,47,0) 42%, rgba(8,58,47,.55) 78%, var(--green-1) 100%);}
  .hero .badge{
    position:absolute;left:20px;top:18px;z-index:2;
    display:inline-flex;align-items:center;gap:7px;
    padding:7px 12px;border-radius:999px;
    background:rgba(5,42,34,.55);backdrop-filter:blur(6px);
    border:1px solid rgba(255,90,60,.5);
    font-size:11px;letter-spacing:.16em;color:#FFD9CF;font-weight:600;}
  .badge .dot{width:6px;height:6px;border-radius:50%;background:var(--red);
    box-shadow:0 0 0 3px rgba(255,90,60,.25)}

  .id{padding:6px 26px 4px}
  .eyebrow{font-family:"Cormorant Garamond",serif;font-size:15px;letter-spacing:.3em;
    text-transform:uppercase;color:var(--mint);font-weight:600;margin-bottom:8px;}
  .name{font-size:46px;font-weight:800;letter-spacing:.04em;line-height:1;color:var(--ivory);}
  .subname{margin-top:12px;font-size:15px;color:var(--slate);font-weight:500;
    display:flex;align-items:center;gap:9px;flex-wrap:wrap;}
  .subname b{color:var(--ivory);font-weight:600}
  .subname .sep{width:4px;height:4px;border-radius:50%;background:var(--slate-dim)}

  .spot{margin:20px 26px 0;height:1px;
    background:linear-gradient(90deg,transparent,var(--mint) 18%,var(--mint) 82%,transparent);opacity:.6;}
  .tagline{padding:16px 26px 6px;font-size:15.5px;line-height:1.55;color:var(--slate);}
  .tagline b{color:var(--mint-soft);font-weight:600}

  .actions{padding:16px 22px 6px;display:flex;flex-direction:column;gap:11px}
  .btn{display:flex;align-items:center;gap:13px;padding:15px 18px;border-radius:14px;
    font-size:15.5px;font-weight:600;text-decoration:none;
    border:1px solid var(--line);background:var(--green-2);color:var(--ivory);
    transition:transform .15s ease,border-color .2s ease;}
  .btn .ic{width:20px;height:20px;flex:0 0 20px;stroke:var(--mint);fill:none;stroke-width:1.7}
  .btn .lbl{flex:1}
  .btn .arw{stroke:var(--slate-dim);width:16px;height:16px;fill:none;stroke-width:1.8}
  .btn:hover{transform:translateY(-2px);border-color:#2c7a64}
  .btn:active{transform:translateY(0)}
  .btn.primary{background:linear-gradient(180deg,var(--mint-soft),var(--mint));
    border-color:var(--mint);color:#053026;}
  .btn.primary .ic{stroke:#053026}
  .btn.primary .lbl{font-weight:700}
  .btn.primary:hover{border-color:var(--mint-soft);box-shadow:0 8px 22px rgba(51,198,164,.28)}
  .row{display:flex;gap:11px}
  .row .btn{flex:1;justify-content:center;gap:9px}
  .btn.video .ic{fill:var(--red);stroke:none}

  .sect{display:flex;align-items:center;gap:10px;margin:14px 4px 2px}
  .sect span{font-family:"Cormorant Garamond",serif;font-size:13px;letter-spacing:.24em;
    text-transform:uppercase;color:var(--mint);font-weight:600;white-space:nowrap}
  .sect .ln{height:1px;flex:1;background:var(--line)}

  :focus-visible{outline:2px solid var(--mint-soft);outline-offset:3px;border-radius:14px}

  .foot{padding:16px 26px 22px;border-top:1px solid var(--line);margin-top:14px}
  .foot .org{font-size:13.5px;color:var(--ivory);font-weight:600}
  .foot .addr{font-size:12.5px;color:var(--slate);margin-top:4px;line-height:1.5}
  .foot a.map{display:inline-block;margin-top:9px;font-size:12.5px;color:var(--mint);
    text-decoration:none;border-bottom:1px solid rgba(51,198,164,.4);padding-bottom:1px}

  @media (max-width:360px){ .name{font-size:40px} }
  @media (prefers-reduced-motion:reduce){ .card{animation:none} .btn{transition:none} }
</style>
</head>

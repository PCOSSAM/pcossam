<!DOCTYPE html><html lang="ko"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>피코쌤 강의 구성기</title><style>body{margin:0;padding:18px;background:#eceef1}</style></head>
<body>
<style>
  .pc-wrap{--navy:#1A3A5C;--gold:#C8973A;--ink:#222;--mut:#6b7280;--line:#e5e7eb;--bg:#f7f8fa;
    font-family:'Malgun Gothic','Noto Sans KR',system-ui,sans-serif;color:var(--ink);
    max-width:920px;margin:0 auto;background:var(--bg);border:1px solid var(--line);border-radius:14px;overflow:hidden}
  .pc-wrap *{box-sizing:border-box}
  .pc-head{background:var(--navy);color:#fff;padding:16px 20px;display:flex;justify-content:space-between;align-items:center}
  .pc-head h1{margin:0;font-size:18px;font-weight:800;letter-spacing:-.3px}
  .pc-head .site{font-size:11px;color:#cbd5e1}
  .pc-cfg{padding:14px 20px;background:#fff;border-bottom:1px solid var(--line);display:flex;flex-wrap:wrap;gap:12px 18px;align-items:flex-end}
  .pc-field{display:flex;flex-direction:column;gap:5px}
  .pc-field label{font-size:11px;font-weight:700;color:var(--mut)}
  .pc-field input[type=text]{border:1px solid var(--line);border-radius:8px;padding:8px 10px;font-size:13px;min-width:230px}
  .pc-chips{display:flex;gap:6px;flex-wrap:wrap}
  .pc-chip{border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;font-size:12px;cursor:pointer;user-select:none;transition:.12s}
  .pc-chip:hover{border-color:var(--gold)}
  .pc-chip.on{background:var(--navy);color:#fff;border-color:var(--navy)}
  .pc-chip.htime.on{background:var(--gold);border-color:var(--gold);color:#1a1a1a;font-weight:700}
  .pc-search{padding:10px 20px;background:#fff;border-bottom:1px solid var(--line)}
  .pc-search input{width:100%;border:1px solid var(--line);border-radius:8px;padding:9px 12px;font-size:13px}
  .pc-body{max-height:none;padding:6px 0 90px}
  .pc-cat{border-bottom:1px solid var(--line)}
  .pc-cathead{display:flex;align-items:center;gap:10px;padding:11px 20px;cursor:pointer;background:#eef1f5}
  .pc-cathead .code{background:var(--navy);color:#fff;width:22px;height:22px;border-radius:6px;display:grid;place-items:center;font-size:11px;font-weight:800}
  .pc-cathead .nm{font-size:13px;font-weight:800;color:var(--navy)}
  .pc-cathead .cnt{font-size:11px;color:var(--mut)}
  .pc-cathead .allbtn{margin-left:auto;font-size:11px;color:var(--gold);font-weight:700;border:none;background:none;cursor:pointer}
  .pc-blocks{padding:6px 14px 12px}
  .pc-blk{display:flex;gap:10px;padding:9px 10px;border:1px solid transparent;border-radius:9px;cursor:pointer}
  .pc-blk:hover{background:#fff;border-color:var(--line)}
  .pc-blk.sel{background:#fff;border-color:var(--gold);box-shadow:0 1px 4px rgba(200,151,58,.15)}
  .pc-blk input{margin-top:3px;accent-color:var(--gold);width:16px;height:16px;flex:0 0 auto}
  .pc-blk .meta{flex:1;min-width:0}
  .pc-blk .top{display:flex;align-items:center;gap:7px;flex-wrap:wrap}
  .pc-blk .id{font-size:10px;font-weight:700;color:var(--mut);font-family:monospace}
  .pc-blk .badge{font-size:10px;padding:1px 7px;border-radius:10px;font-weight:700}
  .b-사례{background:#e0edff;color:#1e56b8}.b-실습{background:#e0f5e6;color:#1f8a45}
  .b-이론{background:#eef0f2;color:#5b6470}.b-코칭{background:#fbf0dc;color:#a9781f}
  .pc-blk .nm{font-size:13px;font-weight:600}
  .pc-blk .d{font-size:11.5px;color:var(--mut);margin-top:2px}
  .pc-foot{position:sticky;bottom:0;background:#fff;border-top:2px solid var(--navy);padding:12px 20px;display:flex;align-items:center;gap:14px;flex-wrap:wrap}
  .pc-foot .sum{font-size:13px}.pc-foot .sum b{color:var(--gold);font-size:16px}
  .pc-foot .warn{font-size:11px;color:#c0392b}
  .pc-go{margin-left:auto;background:var(--gold);color:#1a1a1a;border:none;border-radius:9px;padding:11px 22px;font-size:14px;font-weight:800;cursor:pointer}
  .pc-go:disabled{opacity:.4;cursor:not-allowed}
  .pc-go:hover:not(:disabled){filter:brightness(1.05)}
  .pc-note{font-size:11px;color:var(--mut);padding:8px 20px;background:#fff}
  #pc-toast{position:fixed;left:50%;bottom:26px;transform:translateX(-50%);background:var(--navy);color:#fff;padding:12px 20px;border-radius:10px;font-size:13px;opacity:0;transition:.25s;pointer-events:none;z-index:9;max-width:90%}
  #pc-toast.show{opacity:1}
  textarea.pc-out{width:100%;height:120px;margin-top:8px;font-size:11px;font-family:monospace;border:1px solid var(--line);border-radius:8px;padding:8px;display:none}
</style>

<div class="pc-wrap">
  <div class="pc-head">
    <h1>피코쌤 강의 구성기 <span style="font-weight:400;font-size:12px;opacity:.7">· 콘텐츠 60블록</span></h1>
    <span class="site">PCOSSAM.COM</span>
  </div>

  <div class="pc-cfg">
    <div class="pc-field">
      <label>과정명 / 주제 (자유 입력)</label>
      <input id="pc-course" type="text" placeholder="예: 중소기업 임원 대상 AI 마케팅 특강">
    </div>
    <div class="pc-field">
      <label>교육 대상 (선택 시 후보 자동 필터)</label>
      <div class="pc-chips" id="pc-targets"></div>
    </div>
    <div class="pc-field">
      <label>교육 시간</label>
      <div class="pc-chips" id="pc-hours"></div>
    </div>
  </div>

  <div class="pc-search"><input id="pc-q" type="text" placeholder="🔍 콘텐츠명·설명·ID 검색"></div>
  <div class="pc-body" id="pc-body"></div>

  <div class="pc-foot">
    <div class="sum">선택 <b id="pc-n">0</b>개 · <span id="pc-hlabel">시간 미선택</span></div>
    <span class="warn" id="pc-warn"></span>
    <button class="pc-go" id="pc-go" disabled>선택 완료 → 코드 복사</button>
  </div>
  <div class="pc-note" id="pc-note">이 파일은 저장해두고 언제든 열어 쓰세요. 콘텐츠를 고르고 시간을 선택한 뒤 [선택 완료] 버튼을 누르면 '선택 코드'가 복사됩니다. 그 코드를 클로드 대화창에 붙여넣으면 커리큘럼 PDF가 만들어집니다.</div>
  <textarea class="pc-out" id="pc-out" readonly></textarea>
</div>
<div id="pc-toast"></div>

  const CATS = {"A": "AI 트렌드·산업 인사이트", "B": "AI 커머스·검색 재편", "C": "AI 문서·기획(프롬프트)", "D": "AI 발표·프레젠테이션", "E": "AI 이미지·영상·콘텐츠", "F": "바이브코딩·업무 자동화", "G": "GPT 클론·맞춤화", "H": "영업 특화(지점·기관)", "I": "금융·디지털자산 특화", "J": "강의·교수학습(강사 대상)"};
  const MODE = "file";
  const TARGETS = ["전체", "직무", "경영진", "금융", "영업", "발표", "강사"];
  const HOURS = ["2h", "3h", "4h", "7h", "8h", "14h", "16h"];
  let curTarget="전체", curHours="", q="";
  const selected = new Set();

  const $=s=>document.querySelector(s);
  const body=$("#pc-body");

  // 대상 칩
  const tw=$("#pc-targets");
  TARGETS.forEach((t,i)=>{const c=document.createElement("div");c.className="pc-chip"+(i===0?" on":"");c.textContent=t;
    c.onclick=()=>{curTarget=t;[...tw.children].forEach(x=>x.classList.remove("on"));c.classList.add("on");render();};tw.appendChild(c);});
  // 시간 칩
  const hw=$("#pc-hours");
  HOURS.forEach(h=>{const c=document.createElement("div");c.className="pc-chip htime";c.textContent=h;
    c.onclick=()=>{const was=c.classList.contains("on");[...hw.children].forEach(x=>x.classList.remove("on"));
      if(was){curHours="";}else{c.classList.add("on");curHours=h;}updateFoot();};hw.appendChild(c);});

  $("#pc-q").oninput=e=>{q=e.target.value.trim().toLowerCase();render();};

  function matchTarget(b){ if(curTarget==="전체") return true; return b.g.includes(curTarget)||b.g.includes("전체"); }
  function matchQ(b){ if(!q) return true; return (b.n+b.d+b.id).toLowerCase().includes(q); }

  function render(){
    body.innerHTML="";
    Object.keys(CATS).forEach(code=>{
      const items=BLOCKS.filter(b=>b.c===code && matchTarget(b) && matchQ(b));
      if(!items.length) return;
      const cat=document.createElement("div");cat.className="pc-cat";
      const selCnt=items.filter(b=>selected.has(b.id)).length;
      cat.innerHTML=`<div class="pc-cathead"><span class="code">${code}</span>
        <span class="nm">${CATS[code]}</span><span class="cnt">${items.length}개${selCnt?` · 선택 ${selCnt}`:''}</span>
        <button class="allbtn">전체선택/해제</button></div><div class="pc-blocks"></div>`;
      const bl=cat.querySelector(".pc-blocks");
      items.forEach(b=>{
        const row=document.createElement("label");row.className="pc-blk"+(selected.has(b.id)?" sel":"");
        row.innerHTML=`<input type="checkbox" ${selected.has(b.id)?"checked":""}>
          <div class="meta"><div class="top"><span class="id">${b.id}</span>
          <span class="badge b-${b.t}">${b.t}</span><span class="nm">${b.n}</span></div>
          <div class="d">${b.d}</div></div>`;
        row.querySelector("input").onchange=e=>{e.target.checked?selected.add(b.id):selected.delete(b.id);
          row.classList.toggle("sel",e.target.checked);updateFoot();
          cat.querySelector(".cnt").textContent=`${items.length}개`+ (items.filter(x=>selected.has(x.id)).length?` · 선택 ${items.filter(x=>selected.has(x.id)).length}`:'');};
        bl.appendChild(row);
      });
      cat.querySelector(".allbtn").onclick=ev=>{ev.preventDefault();const all=items.every(b=>selected.has(b.id));
        items.forEach(b=>all?selected.delete(b.id):selected.add(b.id));render();updateFoot();};
      body.appendChild(cat);
    });
    updateFoot();
  }

  function updateFoot(){
    $("#pc-n").textContent=selected.size;
    $("#pc-hlabel").textContent=curHours?curHours+" 과정":"시간 미선택";
    let warn="";
    if(curHours&&selected.size){
      const rec={"2h":[2,4],"4h":[4,7],"7h":[6,10],"8h":[7,11],"14h":[10,16],"16h":[12,18]}[curHours];
      if(selected.size<rec[0]) warn=`※ ${curHours}치고 블록이 적을 수 있어요(권장 ${rec[0]}~${rec[1]})`;
      else if(selected.size>rec[1]) warn=`※ ${curHours}에 비해 블록이 많아요(권장 ${rec[0]}~${rec[1]})`;
    }
    $("#pc-warn").textContent=warn;
    $("#pc-go").disabled=!(selected.size&&curHours);
  }

  function buildPayload(){
    const course=$("#pc-course").value.trim()||"(과정명 미입력)";
    const picked=BLOCKS.filter(b=>selected.has(b.id));
    let lines=picked.map(b=>`- ${b.id} [${b.t}] ${b.n}`).join("\n");
    const ids=picked.map(b=>b.id);
    const j=JSON.stringify({course,target:curTarget,hours:curHours,ids});
    return `===PCOSSAM 강의구성===
과정명: ${course}
대상: ${curTarget}
시간: ${curHours}
선택 블록 (${picked.length}개):
${lines}

위 구성으로 피코쌤 커리큘럼 PDF(표지 로고+사진+PCOSSAM.COM 포함)를 만들어줘.
[DATA]${j}
===END===`;
  }

  function toast(m){const t=$("#pc-toast");t.textContent=m;t.classList.add("show");setTimeout(()=>t.classList.remove("show"),2600);}

  $("#pc-go").onclick=()=>{
    const payload=buildPayload();
    if(MODE==="widget"){
      if(typeof sendPrompt==="function"){sendPrompt(payload);toast("피코쌤에게 구성을 보냈어요. 잠시만요…");}
      else{navigator.clipboard.writeText(payload);toast("복사됨 — 채팅에 붙여넣으세요");}
    }else{
      const out=$("#pc-out");out.style.display="block";out.value=payload;out.select();
      try{navigator.clipboard.writeText(payload);}catch(e){}
      toast("선택 코드 복사됨! 클로드 대화창에 붙여넣으세요");
    }
  };

  render();
})();
</script>
</body></html>

<style>
  :root{
    --navy-0:#0A1A30;      /* deepest — page */
    --navy-1:#0E2140;      /* card */
    --navy-2:#14294B;      /* raised surface */
    --line:#20365C;        /* hairlines */
    --gold:#C9A24B;        /* brand accent */
    --gold-soft:#E4C87E;   /* highlight */
    --ivory:#F4EFE3;       /* primary text */
    --slate:#93A6C4;       /* secondary text */
    --slate-dim:#6E82A3;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{min-height:100%;-webkit-text-size-adjust:100%}
  body{
    font-family:"Pretendard",system-ui,-apple-system,sans-serif;
    background:
      radial-gradient(120% 80% at 50% -10%, #14305a 0%, var(--navy-0) 55%) no-repeat,
      var(--navy-0);
    color:var(--ivory);
    display:flex;justify-content:center;
    padding:22px 16px 40px;
    min-height:100vh;
    -webkit-font-smoothing:antialiased;
  }
  .card{
    width:100%;max-width:430px;
    background:var(--navy-1);
    border:1px solid var(--line);
    border-radius:22px;
    overflow:hidden;
    box-shadow:0 24px 60px rgba(0,0,0,.5), 0 2px 0 rgba(228,200,126,.06) inset;
    animation:rise .7s cubic-bezier(.2,.7,.2,1) both;
  }
  @keyframes rise{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:none}}

  /* ---- HERO ---- */
  .hero{position:relative;line-height:0}
  .hero img{width:100%;height:auto;display:block}
  .hero::after{ /* fade into card */
    content:"";position:absolute;inset:0;
    background:linear-gradient(to bottom, rgba(10,26,48,0) 40%, rgba(10,26,48,.55) 78%, var(--navy-1) 100%);
  }
  .hero .badge{
    position:absolute;left:20px;top:18px;z-index:2;
    display:inline-flex;align-items:center;gap:7px;
    padding:7px 12px;border-radius:999px;
    background:rgba(10,26,48,.55);backdrop-filter:blur(6px);
    border:1px solid rgba(201,162,75,.45);
    font-size:11px;letter-spacing:.14em;color:var(--gold-soft);font-weight:600;
  }
  .badge .dot{width:6px;height:6px;border-radius:50%;background:var(--gold);
    box-shadow:0 0 0 3px rgba(201,162,75,.25)}

  /* ---- IDENTITY ---- */
  .id{padding:6px 26px 4px;text-align:left}
  .eyebrow{
    font-family:"Cormorant Garamond",serif;
    font-size:15px;letter-spacing:.32em;text-transform:uppercase;
    color:var(--gold);font-weight:600;margin-bottom:8px;
  }
  .name{
    font-size:46px;font-weight:800;letter-spacing:-.02em;line-height:1;
    color:var(--ivory);
  }
  .subname{
    margin-top:12px;font-size:15px;color:var(--slate);font-weight:500;
    display:flex;align-items:center;gap:9px;flex-wrap:wrap;
  }
  .subname b{color:var(--ivory);font-weight:600}
  .subname .sep{width:4px;height:4px;border-radius:50%;background:var(--slate-dim)}

  /* spotlight divider */
  .spot{
    margin:20px 26px 0;height:1px;
    background:linear-gradient(90deg,transparent,var(--gold) 18%,var(--gold) 82%,transparent);
    opacity:.65;
  }
  .tagline{
    padding:16px 26px 6px;font-size:15.5px;line-height:1.55;color:var(--slate);
  }
  .tagline b{color:var(--gold-soft);font-weight:600}

  /* ---- ACTIONS ---- */
  .actions{padding:16px 22px 24px;display:flex;flex-direction:column;gap:11px}
  .btn{
    display:flex;align-items:center;gap:13px;
    padding:15px 18px;border-radius:14px;
    font-size:15.5px;font-weight:600;text-decoration:none;
    border:1px solid var(--line);background:var(--navy-2);color:var(--ivory);
    transition:transform .15s ease, border-color .2s ease, background .2s ease;
  }
  .btn .ic{width:20px;height:20px;flex:0 0 20px;stroke:var(--gold);fill:none;stroke-width:1.7}
  .btn .lbl{flex:1}
  .btn .arw{stroke:var(--slate-dim);width:16px;height:16px;fill:none;stroke-width:1.8}
  .btn:hover{transform:translateY(-2px);border-color:#2f4a7a}
  .btn:active{transform:translateY(0)}
  .btn.primary{
    background:linear-gradient(180deg,var(--gold-soft),var(--gold));
    border-color:var(--gold);color:#241a05;
  }
  .btn.primary .ic{stroke:#241a05}
  .btn.primary .lbl{font-weight:700}
  .btn.primary:hover{border-color:var(--gold-soft);box-shadow:0 8px 22px rgba(201,162,75,.28)}
  .row{display:flex;gap:11px}
  .row .btn{flex:1;justify-content:center;gap:9px}

  :focus-visible{outline:2px solid var(--gold-soft);outline-offset:3px;border-radius:14px}

  .foot{
    text-align:center;padding:4px 0 2px;
    font-size:12.5px;letter-spacing:.06em;color:var(--slate-dim);
  }
  .foot a{color:var(--slate);text-decoration:none}

  @media (max-width:360px){ .name{font-size:40px} }
  @media (prefers-reduced-motion:reduce){ .card{animation:none} .btn{transition:none} }
</style>
</head>
